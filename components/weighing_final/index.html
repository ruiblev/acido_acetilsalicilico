<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      color: #f8fafc;
    }
    .container {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 20px;
    }
    
    .scale {
      width: 250px;
      height: 80px;
      background: linear-gradient(to bottom, #f1f5f9, #cbd5e1);
      border-radius: 10px 10px 20px 20px;
      border: 3px solid #94a3b8;
      position: absolute;
      bottom: 20px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 15px rgba(0,0,0,0.1);
    }
    .scale-plate {
      width: 140px;
      height: 15px;
      background: #e2e8f0;
      border: 2px solid #94a3b8;
      border-top-left-radius: 50% 20%;
      border-top-right-radius: 50% 20%;
      position: absolute;
      top: -15px;
      z-index: 2;
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.8);
    }
    .scale-display {
      width: 120px;
      height: 35px;
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      margin-top: 15px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
      border: 2px solid #475569;
    }
    .tare-btn {
      width: 30px;
      height: 10px;
      background: #ef4444;
      border-radius: 5px;
      position: absolute;
      bottom: 10px;
      right: 20px;
    }
    
    .watch-glass {
      width: 100px;
      height: 20px;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      position: absolute;
      top: 50px;
      right: 20px;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 5px;
      transition: top 0.1s, right 0.1s;
    }
    .crystals {
      width: 70px;
      height: 15px;
      background: #f8fafc;
      border-radius: 50% 50% 10% 10%;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }
    .btn:active {
      transform: translateY(2px);
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn.success {
      background: #10b981;
      box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
    }
    .instruction {
      font-size: 16px;
      color: #cbd5e1;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scale">
      <div class="scale-plate"></div>
      <div class="scale-display" id="display">0.0000 g</div>
      <div class="tare-btn"></div>
    </div>
    
    <div class="watch-glass" id="glass">
      <div class="crystals"></div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn" id="action-btn" onmousedown="startPlace()" onmouseup="stopPlace()" onmouseleave="stopPlace()" ontouchstart="startPlace()" ontouchend="stopPlace()">Manter premido para colocar na balança</button>
    <div class="instruction" id="instr-text">Pese os cristais secos para determinar o rendimento.</div>
  </div>

  <script>
    const actionBtn = document.getElementById('action-btn');
    const instrText = document.getElementById('instr-text');
    const display = document.getElementById('display');
    const glass = document.getElementById('glass');
    
    let progress = 0; // 0 to 100
    let interval;
    let placed = false;

    // The plate top is at scale Y (bottom 20px) + 80px - 15px = ~85px from bottom.
    // Glass top starts at 50px from top (container 400px), right 20px.
    // End position: top 270px, right 150px (center).

    function startPlace() {
      if (placed) return;
      
      interval = setInterval(() => {
          progress += 2;
          
          let currentTop = 50 + (220 * (progress / 100));
          let currentRight = 20 + (130 * (progress / 100));
          
          glass.style.top = currentTop + 'px';
          glass.style.right = currentRight + 'px';
          
          if (progress >= 100) {
              placed = true;
              stopPlace();
              
              // Animate weight
              let w = 0;
              let targetMass = parseFloat("{{MASS}}".replace(',', '.'));
              if(isNaN(targetMass)) targetMass = 0.2300;
              
              let step = targetMass / 30; // 30 frames
              
              let wtInt = setInterval(() => {
                  w += step;
                  if (w >= targetMass) {
                      w = targetMass;
                      clearInterval(wtInt);
                      
                      actionBtn.innerText = "Concluir Síntese!";
                      actionBtn.className = "btn success";
                      actionBtn.onmousedown = null;
                      actionBtn.onmouseup = null;
                      actionBtn.onmouseleave = null;
                      actionBtn.ontouchstart = null;
                      actionBtn.ontouchend = null;
                      actionBtn.onclick = finishStep;
                      instrText.innerText = "Massa final registada: " + w.toFixed(4) + " g. Parabéns!";
                  }
                  display.innerText = w.toFixed(4) + " g";
              }, 50);
          }
      }, 30);
    }
    
    function stopPlace() {
       if (interval) {
           clearInterval(interval);
           interval = null;
       }
       if (!placed && progress > 0) {
           // Move back slightly if released
           progress -= 5;
           if (progress < 0) progress = 0;
           let currentTop = 50 + (220 * (progress / 100));
           let currentRight = 20 + (130 * (progress / 100));
           glass.style.top = currentTop + 'px';
           glass.style.right = currentRight + 'px';
       }
    }
    function finishStep() {
        const btn = document.getElementById('action-btn') || document.getElementById('next-btn') || document.getElementById('pour-btn');
        if (btn) {
           btn.innerText = "A aguardar...";
           btn.disabled = true;
           btn.style.pointerEvents = "none";
        }
        if (window.parent && window.parent.document) {
          const buttons = window.parent.document.querySelectorAll('button');
          buttons.forEach(b => {
             if (b.textContent && (b.textContent.includes('Avançar_Hidden') || b.textContent.trim() === 'Avançar')) {
                 b.click();
             }
          });
          
          // Legacy hotplate support
          const tempInputs = window.parent.document.querySelectorAll('input[aria-label="Temp_Hidden"]');
          if (tempInputs.length > 0 && typeof temp !== 'undefined') {
            const tempInput = tempInputs[0];
            const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            setter.call(tempInput, Math.floor(temp).toString());
            tempInput.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
    }
        }
    }
  </script>
</body>
</html>
