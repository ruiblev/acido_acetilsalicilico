<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      color: #f8fafc;
    }
    .container {
      position: relative;
      width: 400px;
      height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 20px;
    }
    
    /* Kitasato & Funnel Base */
    .funnel {
      width: 80px;
      height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      position: absolute;
      top: 200px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      border-radius: 5px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }
    .funnel-tube {
      width: 15px;
      height: 50px;
      border-left: 3px solid rgba(255, 255, 255, 0.9);
      border-right: 3px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.2);
      position: absolute;
      top: 260px;
      z-index: 3;
    }
    .filter-paper {
      width: 70px;
      height: 5px;
      background: #f8fafc;
      border-radius: 50%;
      position: absolute;
      bottom: 5px;
      z-index: 5;
    }
    .crystals {
      width: 60px;
      height: 15px;
      background: rgba(255, 255, 255, 0.9);
      position: absolute;
      bottom: 10px;
      z-index: 5;
      border-radius: 5px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    .kitasato {
      width: 140px;
      height: 160px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(2px);
      box-shadow: inset -5px -5px 15px rgba(255,255,255,0.2), inset 5px 5px 15px rgba(255,255,255,0.4), 0 10px 15px rgba(0,0,0,0.1);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      clip-path: polygon(40% 0%, 60% 0%, 60% 30%, 100% 90%, 100% 100%, 0% 100%, 0% 90%, 40% 30%);
      border-radius: 5px;
      overflow: hidden;
    }
    .kitasato::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      width: 20%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-15deg);
      pointer-events: none;
    }

    .side-arm {
      width: 40px;
      height: 10px;
      border-top: 3px solid rgba(255, 255, 255, 0.8);
      border-bottom: 3px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.2);
      position: absolute;
      top: 330px;
      left: 175px;
      z-index: 1;
    }
    .hose {
      position: absolute;
      top: 335px;
      left: 100px;
      width: 75px;
      height: 40px;
      border: 6px solid #334155;
      border-top: none;
      border-left: none;
      border-radius: 0 0 20px 0;
      z-index: 0;
    }
    .vacuum-pump {
      width: 60px;
      height: 80px;
      background: linear-gradient(to bottom, #475569, #1e293b);
      border-radius: 8px;
      position: absolute;
      bottom: 50px;
      left: 40px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      border: 2px solid #94a3b8;
    }
    .pump-dial {
      width: 24px;
      height: 24px;
      background: #f8fafc;
      border-radius: 50%;
      border: 3px solid #94a3b8;
      position: relative;
    }
    .pump-dial::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      width: 8px;
      height: 2px;
      background: #ef4444;
      transform-origin: left center;
      transform: rotate(45deg);
    }
    .filtrate {
      width: 100%;
      height: 40%;
      background: rgba(150, 200, 255, 0.5);
      position: absolute;
      bottom: 0;
      transition: height 0.5s linear;
    }

    /* Washing Elements */
    .wash-bottle {
      width: 60px;
      height: 90px;
      background: rgba(255, 255, 255, 0.8);
      border: 3px solid rgba(200, 200, 200, 0.5);
      border-radius: 10px;
      position: absolute;
      top: 120px;
      right: 60px;
      z-index: 6;
      transform: rotate(-30deg);
      transform-origin: bottom center;
      transition: transform 0.2s;
    }
    .wash-bottle.squeezed {
      transform: rotate(-35deg) scaleX(0.9);
    }
    .wash-tube {
      width: 8px;
      height: 80px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(200, 200, 200, 0.5);
      position: absolute;
      top: -70px;
      left: 10px;
      border-radius: 4px;
      transform: rotate(-60deg);
      transform-origin: bottom;
    }
    .spray {
      width: 6px;
      height: 0px;
      background: repeating-linear-gradient(to bottom, rgba(100, 200, 255, 0.9) 0px, rgba(100, 200, 255, 0.9) 8px, transparent 8px, transparent 16px);
      background-size: 100% 16px;
      position: absolute;
      top: 125px;
      right: 175px; 
      z-index: 7;
      transform: rotate(45deg);
      transform-origin: top;
      transition: height 0.1s;
    }
    .spray.active {
      height: 100px;
      animation: water-flow 0.2s linear infinite;
    }
    @keyframes water-flow {
      0% { background-position: 0 0; }
      100% { background-position: 0 16px; }
    }
    
    
    .drop {
      width: 8px;
      height: 15px;
      background: rgba(100, 200, 255, 0.5);
      border-radius: 50%;
      position: absolute;
      top: 310px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      z-index: 3;
    }
    @keyframes drip {
      0% { top: 310px; opacity: 1; }
      100% { top: 420px; opacity: 0; }
    }
    
    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }
    .btn:active {
      transform: translateY(2px);
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn.success {
      background: #10b981;
      box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
    }
    .instruction {
      font-size: 16px;
      color: #cbd5e1;
      text-align: center;
      font-weight: 600;
    }
    .progress-bar {
      width: 200px;
      height: 10px;
      background: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 5px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.1s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wash-bottle" id="bottle">
      <div class="wash-tube"></div>
    </div>
    <div class="spray" id="spray"></div>
    
    <div class="funnel">
      <div class="filter-paper"></div>
      <div class="crystals"></div>
    </div>
    <div class="funnel-tube"></div>
    
    <div class="drop" id="drop"></div>

    <div class="side-arm"></div>
    <div class="hose"></div>
    
    <div class="vacuum-pump" id="pump">
      <div class="pump-dial"></div>
    </div>
    
    <div class="kitasato">
      <div class="filtrate" id="filtrate"></div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn" id="action-btn" onmousedown="startWashing()" onmouseup="stopWashing()" onmouseleave="stopWashing()" ontouchstart="startWashing()" ontouchend="stopWashing()">Manter premido para lavar</button>
    <div class="instruction" id="instr-text">Lave os cristais com água fria duas vezes.</div>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  </div>

  <script>
    const actionBtn = document.getElementById('action-btn');
    const instrText = document.getElementById('instr-text');
    const bottle = document.getElementById('bottle');
    const spray = document.getElementById('spray');
    const progressFill = document.getElementById('progress');
    const filtrate = document.getElementById('filtrate');
    
    let washAmount = 0;
    let washInterval;
    let filtLevel = 40;

    function startWashing() {
      if (washAmount >= 100) return;
      bottle.classList.add('squeezed');
      spray.classList.add('active');
      
      washInterval = setInterval(() => {
          washAmount += 2;
          progressFill.style.width = washAmount + '%';
          
          if (washAmount % 10 === 0) {
              const d = document.createElement('div');
              d.className = 'drop';
              d.style.animation = 'drip 0.3s linear forwards';
              document.querySelector('.container').appendChild(d);
              setTimeout(() => d.remove(), 300);
              
              filtLevel += 1;
              filtrate.style.height = filtLevel + '%';
          }
          
          if (washAmount >= 50 && washAmount < 100) {
              instrText.innerText = "Primeira lavagem concluída. Continue para a segunda vez.";
          }
          
          if (washAmount >= 100) {
              stopWashing();
              actionBtn.innerText = "Confirmar e Avançar";
              actionBtn.className = "btn success";
              actionBtn.onmousedown = null;
              actionBtn.onmouseup = null;
              actionBtn.onmouseleave = null;
              actionBtn.ontouchstart = null;
              actionBtn.ontouchend = null;
              actionBtn.onclick = finishStep;
              instrText.innerText = "Lavagem concluída com sucesso.";
          }
      }, 50);
    }
    
    function stopWashing() {
       if (washInterval) {
           clearInterval(washInterval);
           washInterval = null;
       }
       bottle.classList.remove('squeezed');
       spray.classList.remove('active');
    }
        function finishStep() {
        const btn = document.getElementById('action-btn') || document.getElementById('next-btn') || document.getElementById('pour-btn');
        if (btn) {
           btn.innerText = "A aguardar...";
           btn.disabled = true;
           btn.style.pointerEvents = "none";
        }
        if (window.parent && window.parent.document) {
          const buttons = window.parent.document.querySelectorAll('button');
          buttons.forEach(b => {
             if (b.textContent && (b.textContent.includes('Avançar_Hidden') || b.textContent.trim() === 'Avançar')) {
                 b.click();
             }
          });
          
          // Legacy hotplate support
          const tempInputs = window.parent.document.querySelectorAll('input[aria-label="Temp_Hidden"]');
          if (tempInputs.length > 0 && typeof temp !== 'undefined') {
            const tempInput = tempInputs[0];
            const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            setter.call(tempInput, Math.floor(temp).toString());
            tempInput.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
    }
  </script>
</body>
</html>
