<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      color: #f8fafc;
    }
    .container {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 20px;
    }
    .pipette-wrapper {
      position: absolute;
      top: 0px; 
      left: 180px; 
      width: 40px;
      height: 200px;
      z-index: 4;
      transition: top 1s ease-in-out;
    }
    .pipette-tube {
      position: absolute;
      left: 14px;
      width: 12px;
      height: 200px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(2px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 4;
    }
    .pipette-bulb {
      position: absolute;
      top: 60px;
      left: 4px;
      width: 32px;
      height: 60px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(2px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 3;
    }
    .pipette-liquid {
      width: 100%;
      height: 150px;
      background: rgba(100, 200, 255, 0.6);
      transition: height 0.05s linear;
    }
    .pipette-wrapper.pouring {
      top: 50px;
    }

    .flask {
      width: 140px;
      height: 160px;
      position: absolute;
      bottom: 20px;
      left: 130px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(2px);
      box-shadow: inset -5px -5px 15px rgba(255,255,255,0.2), inset 5px 5px 15px rgba(255,255,255,0.4), 0 10px 15px rgba(0,0,0,0.1);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      clip-path: polygon(40% 0%, 60% 0%, 60% 30%, 100% 90%, 100% 100%, 0% 100%, 0% 90%, 40% 30%);
      border-radius: 5px;
      overflow: hidden;
    }
    .flask::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      width: 20%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-15deg);
      pointer-events: none;
    }
    .flask-liquid {
      width: 100%;
      height: 40%;
      background: linear-gradient(to top, rgba(200, 200, 200, 0.8) 10%, rgba(100, 150, 255, 0.4) 100%);
      position: absolute;
      bottom: 0;
      transition: height 0.05s linear;
    }

    .stream {
      width: 6px;
      height: 0px;
      background: rgba(100, 200, 255, 0.5);
      position: absolute;
      top: 250px;
      left: 197px;
      z-index: 1;
      transition: height 0.1s linear, top 0.1s linear;
      transform-origin: top;
    }
    .stream.active {
      height: 80px;
    }
    .stream.finishing {
      height: 0px;
      top: 330px;
    }
    
    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }
    .btn:active {
      transform: translateY(2px);
    }
    .btn.success {
      background: #10b981;
      box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pipette-wrapper" id="pipette">
      <div class="pipette-tube">
        <div class="pipette-liquid" id="pipette-liquid-tube"></div>
      </div>
      <div class="pipette-bulb">
        <div class="pipette-liquid" id="pipette-liquid-bulb"></div>
      </div>
    </div>
    <div class="stream" id="stream"></div>
    
    <div class="flask">
      <div class="flask-liquid" id="flask-liquid"></div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn" id="action-btn" onmousedown="startPour()" onmouseup="stopPour()" onmouseleave="stopPour()" ontouchstart="startPour()" ontouchend="stopPour()">Manter premido para adicionar ({{AMOUNT}})</button>
  </div>

  <script>
    const pipette = document.getElementById('pipette');
    const tubeLiquid = document.getElementById('pipette-liquid-tube');
    const bulbLiquid = document.getElementById('pipette-liquid-bulb');
    const flaskLiquid = document.getElementById('flask-liquid');
    const stream = document.getElementById('stream');
    const actionBtn = document.getElementById('action-btn');

    let pourAmount = 0;
    let isPouring = false;
    let pourInterval;
    let preparationTimeout;
    
    function updatePipetteLiquid(lvl) {
      if (lvl < 0) lvl = 0;
      tubeLiquid.style.transition = 'none';
      bulbLiquid.style.transition = 'none';
      tubeLiquid.style.height = lvl + 'px';
      
      if (lvl > 80) {
        let bHeight = lvl - 80;
        if (bHeight > 60) bHeight = 60;
        bulbLiquid.style.height = bHeight + 'px';
      } else {
        bulbLiquid.style.height = '0px';
      }
    }
    
    updatePipetteLiquid(150);

    function startPour() {
      if (pourAmount >= 100) return;
      isPouring = true;
      pipette.classList.add('pouring');
      
      preparationTimeout = setTimeout(() => {
        if (!isPouring) return;
        stream.classList.add('active');
        stream.classList.remove('finishing');
        stream.style.top = '250px';
        
        pourInterval = setInterval(() => {
           pourAmount += 2;
           let liquidLevel = 150 - (pourAmount * 1.5);
           updatePipetteLiquid(liquidLevel);
           
           flaskLiquid.style.transition = 'none';
           flaskLiquid.style.height = (40 + pourAmount * 0.15) + '%'; 
           
           if (pourAmount >= 100) {
               stopPour();
               actionBtn.innerText = "Confirmar e Avançar";
               actionBtn.className = "btn success";
               actionBtn.onmousedown = null;
               actionBtn.onmouseup = null;
               actionBtn.onmouseleave = null;
               actionBtn.ontouchstart = null;
               actionBtn.ontouchend = null;
               actionBtn.onclick = finishStep;
           }
        }, 50);
      }, 1000); 
    }
    
    function stopPour() {
       isPouring = false;
       clearTimeout(preparationTimeout);
       if (pourInterval) {
           clearInterval(pourInterval);
           pourInterval = null;
       }
       if (pourAmount < 100) {
           stream.classList.remove('active');
           stream.classList.add('finishing');
       }
       pipette.classList.remove('pouring');
    }
        function finishStep() {
        const btn = document.getElementById('action-btn') || document.getElementById('next-btn') || document.getElementById('pour-btn');
        if (btn) {
           btn.innerText = "A aguardar...";
           btn.disabled = true;
           btn.style.pointerEvents = "none";
        }
        if (window.parent && window.parent.document) {
          const buttons = window.parent.document.querySelectorAll('button');
          buttons.forEach(b => {
             if (b.textContent && (b.textContent.includes('Avançar_Hidden') || b.textContent.trim() === 'Avançar')) {
                 b.click();
             }
          });
          
          // Legacy hotplate support
          const tempInputs = window.parent.document.querySelectorAll('input[aria-label="Temp_Hidden"]');
          if (tempInputs.length > 0 && typeof temp !== 'undefined') {
            const tempInput = tempInputs[0];
            const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            setter.call(tempInput, Math.floor(temp).toString());
            tempInput.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
    }
  </script>
</body>
</html>
