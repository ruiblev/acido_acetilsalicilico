name: Keep Alive - Auto Commit Diário

on:
  schedule:
    # Corre todos os dias às 08:00, 14:00 e 20:00 UTC
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  keep_alive:
    name: Auto Commit para manter Streamlit ativo
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necessário para o GITHUB_TOKEN poder fazer push

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar ping à app Streamlit
        run: python keep_alive.py
        continue-on-error: true  # Não falha o workflow se o ping falhar

      - name: Commit e Push das alterações (forçado)
        run: |
          # Garante sempre uma alteração mesmo que o log não mude
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "Last keep-alive: ${TIMESTAMP}" > .keepalive

          git add keep_alive_log.txt .keepalive
          git commit -m "chore: keep-alive auto-commit ${TIMESTAMP}" || echo "Nada para commitar"
          git push
          echo "✅ Push realizado com sucesso!"
