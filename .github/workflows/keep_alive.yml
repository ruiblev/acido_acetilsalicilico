name: Keep Alive - Auto Commit de 6h em 6h

on:
  schedule:
    # Corre de 6h em 6h: 00:00, 06:00, 12:00 e 18:00 UTC
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  keep_alive:
    name: Ping e commit para manter Streamlit ativo
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necessário para o GITHUB_TOKEN poder fazer push

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar ping à app Streamlit (1ª tentativa)
        run: python keep_alive.py
        continue-on-error: true

      - name: Aguardar 30 segundos e fazer 2º ping (reforço)
        run: |
          sleep 30
          python keep_alive.py
        continue-on-error: true

      - name: Commit e Push das alterações (forçado)
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "Last keep-alive: ${TIMESTAMP}" > .keepalive

          git add keep_alive_log.txt .keepalive
          git commit -m "chore: keep-alive auto-commit ${TIMESTAMP}" || echo "Nada para commitar"
          git push
          echo "✅ Push realizado com sucesso!"
